<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/48.png" alt="" width="28" height="28">
    <h1>Twinsub</h1>
    <label class="switch"><input type="checkbox" id="enabled"><span></span></label>
  </header>
  <p class="how" data-i18n="popupHow"></p>
  <label class="row"><span data-i18n="popupTarget"></span><select id="target"></select></label>
  <fieldset class="row">
    <legend data-i18n="popupOrder"></legend>
    <label><input type="radio" name="order" value="original-first"> <span data-i18n="popupOrderOriginal"></span></label>
    <label><input type="radio" name="order" value="translation-first"> <span data-i18n="popupOrderTranslation"></span></label>
  </fieldset>
  <div class="row checks">
    <label><input type="checkbox" id="showOriginal"> <span data-i18n="popupShowOriginal"></span></label>
    <label><input type="checkbox" id="showTranslation"> <span data-i18n="popupShowTranslation"></span></label>
  </div>
  <label class="row"><span data-i18n="popupSize"></span><input type="range" id="size" min="0.7" max="1.8" step="0.1"></label>
  <label class="row"><span data-i18n="popupPosition"></span><input type="range" id="bottom" min="2" max="40" step="1"></label>
  <section id="pro" hidden>
    <div class="pro-free">
      <h2>Twinsub Pro</h2>
      <p data-i18n="proPitch"></p>
      <button type="button" id="upgrade" class="primary" data-i18n="proUpgrade"></button>
      <details>
        <summary data-i18n="proHave"></summary>
        <form id="restore" class="code-row"><input id="code" autocomplete="off" spellcheck="false" placeholder="TWIN-XXXX-XXXX-XXXX"><button type="submit" data-i18n="proApply"></button></form>
      </details>
      <p id="codeMsg" class="msg" hidden></p>
    </div>
    <div class="pro-on" hidden>
      <h2>Twinsub Pro <span id="proLeft"></span></h2>
      <p id="proEnds" hidden></p>
      <p data-i18n="proCodeLabel"></p>
      <div class="code-row"><code id="myCode"></code><button type="button" id="copy" data-i18n="proCopy"></button></div>
      <a href="#" id="manage" data-i18n="proManage"></a>
    </div>
  </section>
  <footer>
    <p data-i18n="popupPrivacy"></p>
    <a href="https://twinsub.poeticalengine.com/privacy/" target="_blank" rel="noopener" data-i18n="popupPrivacyLink"></a>
  </footer>
  <script src="../src/captions.js"></script>
  <script src="popup.js"></script>
</body>
</html>
