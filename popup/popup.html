<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/48.png" alt="" width="28" height="28">
    <h1>Twinsub</h1>
    <label class="switch"><input type="checkbox" id="enabled"><span></span></label>
  </header>
  <p class="how" data-i18n="popupHow"></p>
  <label class="row"><span data-i18n="popupTarget"></span><select id="target"></select></label>
  <fieldset class="row">
    <legend data-i18n="popupOrder"></legend>
    <label><input type="radio" name="order" value="original-first"> <span data-i18n="popupOrderOriginal"></span></label>
    <label><input type="radio" name="order" value="translation-first"> <span data-i18n="popupOrderTranslation"></span></label>
  </fieldset>
  <div class="row checks">
    <label><input type="checkbox" id="showOriginal"> <span data-i18n="popupShowOriginal"></span></label>
    <label><input type="checkbox" id="showTranslation"> <span data-i18n="popupShowTranslation"></span></label>
  </div>
  <label class="row"><span data-i18n="popupSize"></span><input type="range" id="size" min="0.7" max="1.8" step="0.1"></label>
  <label class="row"><span data-i18n="popupPosition"></span><input type="range" id="bottom" min="2" max="40" step="1"></label>
  <footer>
    <p data-i18n="popupPrivacy"></p>
    <a href="https://github.com/poeticalengine/twinsub/blob/main/PRIVACY.md" target="_blank" rel="noopener" data-i18n="popupPrivacyLink"></a>
  </footer>
  <script src="../src/captions.js"></script>
  <script src="popup.js"></script>
</body>
</html>
