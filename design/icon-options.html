<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:32px;background:#f1f1f1;font:600 15px -apple-system,"PingFang SC";color:#222;display:flex;gap:28px}
.col{display:flex;flex-direction:column;align-items:center;gap:14px;width:250px}
.col p{margin:0;text-align:center;font-weight:500;color:#555;font-size:13px;line-height:1.5}
.row{display:flex;gap:14px;align-items:center}
.bar{background:#fff;border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.dark{background:#202124}
</style></head><body>
<div class="col"><h3>A 现在</h3>
<svg width="128" height="128" viewBox="0 0 128 128"><rect x="16" y="16" width="96" height="96" rx="22" fill="#141418"/><rect x="34" y="50" width="60" height="11" rx="5.5" fill="#fff"/><rect x="42" y="69" width="44" height="11" rx="5.5" fill="#ffe27a"/></svg>
<div class="row"><div class="bar"><svg width="16" height="16" viewBox="0 0 128 128"><rect x="16" y="16" width="96" height="96" rx="22" fill="#141418"/><rect x="34" y="50" width="60" height="11" rx="5.5" fill="#fff"/><rect x="42" y="69" width="44" height="11" rx="5.5" fill="#ffe27a"/></svg></div><div class="bar dark"><svg width="16" height="16" viewBox="0 0 128 128"><rect x="16" y="16" width="96" height="96" rx="22" fill="#141418"/><rect x="34" y="50" width="60" height="11" rx="5.5" fill="#fff"/><rect x="42" y="69" width="44" height="11" rx="5.5" fill="#ffe27a"/></svg></div></div>
<p>自有风格，和 YouTube 没关系</p></div>

<div class="col"><h3>B 字幕框（推荐）</h3>
<svg id="b" width="128" height="128" viewBox="0 0 128 128"><rect x="8" y="8" width="112" height="112" rx="26" fill="#0f0f0f"/><rect x="24" y="34" width="80" height="60" rx="12" fill="none" stroke="#fff" stroke-width="8"/><rect x="38" y="52" width="52" height="8" rx="4" fill="#fff"/><rect x="38" y="68" width="34" height="8" rx="4" fill="#ffe27a"/></svg>
<div class="row"><div class="bar"><svg width="16" height="16" viewBox="0 0 128 128"><rect x="8" y="8" width="112" height="112" rx="26" fill="#0f0f0f"/><rect x="24" y="34" width="80" height="60" rx="12" fill="none" stroke="#fff" stroke-width="10"/><rect x="38" y="54" width="52" height="10" rx="5" fill="#fff"/><rect x="38" y="70" width="34" height="10" rx="5" fill="#ffe27a"/></svg></div><div class="bar dark"><svg width="16" height="16" viewBox="0 0 128 128"><rect x="8" y="8" width="112" height="112" rx="26" fill="#0f0f0f"/><rect x="24" y="34" width="80" height="60" rx="12" fill="none" stroke="#fff" stroke-width="10"/><rect x="38" y="54" width="52" height="10" rx="5" fill="#fff"/><rect x="38" y="70" width="34" height="10" rx="5" fill="#ffe27a"/></svg></div></div>
<p>借 YouTube 播放器「CC 字幕」按钮的外形和黑白线条，一眼看出是「视频字幕」；黄色第二行仍是我们的标志</p></div>

<div class="col"><h3>C 红底（不建议）</h3>
<svg width="128" height="128" viewBox="0 0 128 128"><rect x="8" y="22" width="112" height="84" rx="24" fill="#ff0033"/><rect x="30" y="50" width="68" height="10" rx="5" fill="#fff"/><rect x="30" y="68" width="44" height="10" rx="5" fill="#ffe27a"/></svg>
<div class="row"><div class="bar"><svg width="16" height="16" viewBox="0 0 128 128"><rect x="8" y="22" width="112" height="84" rx="24" fill="#ff0033"/><rect x="30" y="50" width="68" height="12" rx="6" fill="#fff"/><rect x="30" y="70" width="44" height="12" rx="6" fill="#ffe27a"/></svg></div><div class="bar dark"><svg width="16" height="16" viewBox="0 0 128 128"><rect x="8" y="22" width="112" height="84" rx="24" fill="#ff0033"/><rect x="30" y="50" width="68" height="12" rx="6" fill="#fff"/><rect x="30" y="70" width="44" height="12" rx="6" fill="#ffe27a"/></svg></div></div>
<p>最像 YouTube，但红色圆角矩形就是 YouTube 的商标外形，Chrome 商店会以「冒充 / 商标」拒审</p></div>
</body></html>
